<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Modern Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">BrandLogo</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="programs.html">Programs</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Contact Us</h1>
      <p>Have questions about our programs or need help getting started? Send us a message.</p>
    </section>

    <form class="contact-form" action="#" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help..." required></textarea>
      </div>

      <button type="submit" class="btn" style="width: 100%;">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 BrandLogo. All rights reserved.</p>
  </footer>

</body>
</html>
