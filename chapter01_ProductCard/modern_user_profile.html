<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Profile Card Container -->
    <main class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 transform transition-all hover:-translate-y-1 hover:shadow-2xl duration-300">
        
        <!-- Cover Photo / Header Banner -->
        <div class="h-32 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 relative">
            <!-- Optional subtle overlay pattern -->
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent"></div>
        </div>

        <!-- Card Content -->
        <div class="px-6 py-8 relative">
            
            <!-- Profile Image (Overlapping the banner) -->
            <div class="absolute -top-16 left-6">
                <img src="https://placehold.co/400x400/1e40af/ffffff?text=SS" 
                     alt="SENG Sourng" 
                     class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover bg-white">
            </div>

            <!-- Page Headings -->
            <div class="mt-8 mb-6 border-b border-gray-100 pb-4">
                <h1 class="text-2xl font-bold text-gray-900">User Profile</h1>
                <p class="text-sm text-gray-500 mt-1">Welcome to your profile!</p>
            </div>

            <!-- User Info -->
            <div class="mb-6">
                <h2 class="text-xl font-bold text-gray-800">SENG Sourng</h2>
                <h3 class="text-sm font-semibold text-indigo-600 uppercase tracking-wider mt-1">Software Engineer</h3>
            </div>

            <!-- Descriptive Paragraphs -->
            <div class="text-gray-600 text-sm space-y-3 leading-relaxed mb-8">
                <p>Here you can manage your account settings and personal information.</p>
                <p>You can also view your activity and update your preferences.</p>
                <p>Feel free to explore and customize your profile to your liking.</p>
            </div>

            <!-- Action Button -->
            <div>
                <a href="#" class="group relative flex justify-center items-center w-full px-6 py-3.5 text-sm font-medium text-white bg-gray-900 rounded-xl hover:bg-indigo-600 transition-colors duration-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    View Detail Profile
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2 transform group-hover:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </a>
            </div>

        </div>
    </main>

</body>
</html>
