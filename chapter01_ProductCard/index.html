<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Product Card</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="product-card">
        <!-- Product Image -->
        <div class="image-container">
            <img
                src="images/product.png"
                alt="Wireless Headphones"
            >
            <span class="badge">NEW</span>
        </div>

        <!-- Product Content -->
        <div class="content">
            <h2 class="title">
                Wireless Headphones
            </h2>
            <p class="description">
                High quality sound, comfortable design,
                and long battery life for your daily use.
            </p>
            <a href="#" class="btn">
                 View Details
            </a>
        </div>

    </div>

    <div class="product-card">
        <!-- Product Image -->
        <div class="image-container">
            <img
                src="images/java_programming.png"
                alt="Java Programming"
            >
            <span class="badge">ថ្មី</span>
        </div>

        <!-- Product Content -->
        <div class="content">
            <h2 class="title">
                សៀវភៅ Java Programming
            </h2>
            <p class="description">
                មេរៀន​សម្រាប់​អ្នក​ចាប់​ផ្តើម​រៀន Java Programming
            </p>
            <a href="#" class="btn">
                 មើល​បន្ថែម
            </a>
        </div>

    </div>

</body>
</html>
