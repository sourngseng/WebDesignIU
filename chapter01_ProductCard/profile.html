<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8; /* Soft light gray background */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }    
        
        /* profile-container */
        .profile-container {
            width: 100%;
            max-width: 420px;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 24px;
        }

        /* card */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            /* Show mouse as hand */
            cursor: pointer;
        }

        /* cover-background */
        .cover-background {
            height: 120px;
            background-image: url('images/cover_background.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        /* card-body */
        .card-body {
            padding: 0 24px 32px 24px;
            position: relative;
            text-align: center;
        }
        /* profile-image */
        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            position: absolute;
            top: -55px; 
            left: 50%;
            transform: translateX(-50%);
        }
        .image-spacer {
            height: 75px; 
        }
        .user-name {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        .user-title {
            font-size: 16px;
            color: #0755f1;
            margin-bottom: 16px;
        }
        .user-description {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 24px;
            align-items: center;
            text-align: left;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #111827;
            color: #fff;
            text-decoration: none;
            width: 100%;
            border-radius: 25px;
        }

        .btn:hover {
            background-color: #374151;
        }
        .btn:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>
    <div class="profile-container">
        <header class="page-header">
            <h1>User Profile</h1>
            <p>Welcome to your profile!</p>
        </header>
        <!-- Profile Card -->
            <main class="card">
                <!-- Cover Background -->
                <div class="cover-background"></div>

                <div class="card-body">
                     <img class="profile-image" src="images/product.png" alt="SENG Sourng" width="150" height="150">
                     <div class="image-spacer"></div>
                     
                     <h3 class="user-name">SENG Sourng</h3>
                     <h5 class="user-title">Software Engineer</h5>

                    <div class="user-description">
                        <p>Here you can manage your account settings and personal information.</p>
                        <p>You can also view your activity and update your preferences.</p>
                        <p>Feel free to explore and customize your profile to your liking.</p>
                                       
                    </div>
                    <a href="#" class="btn">
                        View Detail Profile
                    </a>
                </div>
            </main>
    </div>    
</body>
</html>
